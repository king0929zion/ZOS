plugins {
    id 'com.android.application'
}

// 加载签名配置
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.browseros.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.browseros.android"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // 签名配置优先级：
            // 1. 环境变量（CI/CD）
            // 2. keystore.properties 文件（本地开发）
            // 3. 如果都未配置，使用 debug 签名（用于测试）
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: keystoreProperties['KEYSTORE_FILE']
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['KEYSTORE_PASSWORD']
            def keyAliasName = System.getenv("KEY_ALIAS") ?: keystoreProperties['KEY_ALIAS'] ?: "browseros"
            def keyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['KEY_PASSWORD']
            
            // 如果配置了签名信息，使用自定义签名
            if (keystoreFile && keystorePassword && keyPassword) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPassword
            }
            // 否则使用 debug 签名（用于测试，不推荐用于生产环境）
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false  // 暂时禁用资源压缩，避免构建失败
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 如果配置了 release 签名则使用，否则使用 debug 签名
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Android 核心库
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // JSON 解析
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'
    
    // 测试
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

